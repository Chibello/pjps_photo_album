# Add this to your pubspec.yaml (outside dev_dependencies)
flutter_launcher_icons:
  # Mobile platforms
  android: true
  ios: true

  # Desktop platforms
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"

  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"

  linux:
    generate: true
    image_path: "assets/icons/app_icon.png"

  # Main icon for mobile & desktop
  image_path: "assets/icons/app_icon.png"

  # Android adaptive icon background (can be color or image)
  adaptive_icon_background: "#F4C542"

  # Use same icon as foreground to avoid missing file errors
  # adaptive_icon_foreground is optional; default uses image_path

  # iOS option
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F4C542"
  image: assets/images/splash_logo.png
  android: true
  ios: true
  
  android_12:
    image: assets/images/splash_logo.png
    color: "#F4C542"
